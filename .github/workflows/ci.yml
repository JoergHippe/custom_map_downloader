name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python tests, release governance and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Black
        run: python -m black --check custom_map_downloader scripts tests
      - name: Unit tests (without QGIS)
        run: python -m unittest discover -s tests -v
      - name: Translation status
        run: python scripts/check_translations.py
      - name: Release governance
        run: python scripts/check_release_governance.py
      - name: Build and verify plugin ZIP
        run: |
          VERSION=$(sed -n 's/^version=//p' custom_map_downloader/metadata.txt | head -n 1)
          qgis-plugin-ci package "$VERSION" -c
          python scripts/check_package.py

  # QGIS 3/4 runtime matrix is intentionally deferred until the strict import
  # probe and basic Qt6 compatibility have been validated. The previous
  # self-hosted Windows workflow remains archived under ci-disabled/.
