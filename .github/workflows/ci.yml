name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python tests, release governance and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Black
        run: python -m black --check --diff custom_map_downloader scripts tests
      - name: Unit tests (without QGIS)
        run: python -m unittest discover -s tests -v
      - name: Translation status
        run: python scripts/check_translations.py
      - name: Release governance
        run: python scripts/check_release_governance.py
      - name: Build and verify plugin ZIP
        run: |
          VERSION=$(sed -n 's/^version=//p' custom_map_downloader/metadata.txt | head -n 1)
          qgis-plugin-ci package "$VERSION" -c
          python scripts/check_package.py

  qgis-runtime:
    name: QGIS ${{ matrix.major }} imports and raster smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 3
            image: 3.44.15-noble
          - major: 4
            image: 4.2.3-resolute
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Real QGIS import and export integration tests
        env:
          IMAGE: ${{ matrix.image }}
          MAJOR: ${{ matrix.major }}
        run: |
          docker run --rm --entrypoint /bin/bash \
            -e QT_QPA_PLATFORM=offscreen \
            -e CMD_REQUIRE_QGIS=1 \
            -e MAJOR \
            -v "$PWD:/workspace:rw" -w /workspace \
            "qgis/qgis:$IMAGE" -lc '
              set -euo pipefail
              python3 scripts/check_qgis_runtime.py --major "$MAJOR"
              python3 -m unittest discover -s tests/integration -p test_qimage_memory.py -v
              python3 -m unittest discover -s tests/integration -p test_export_smoke.py -v
              python3 -m unittest discover -s tests/integration -p test_mbtiles_export.py -v
              python3 -m unittest discover -s tests/integration -p test_mbtiles_preflight.py -v
              python3 -m unittest discover -s tests/integration -p test_extent_dialog.py -v
            '
